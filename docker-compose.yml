services:
  signal-cli:
    image: registry.gitlab.com/packaging/signal-cli/signal-cli-native:latest
    container_name: tracker-signal
    restart: unless-stopped
    env_file:
      - .env
    command: --config /var/lib/signal-cli -u ${SIGNAL_PHONE_NUMBER} daemon --tcp 0.0.0.0:6001 --receive-mode on-connection
    volumes:
      - ./signal-cli-config:/var/lib/signal-cli
    depends_on:
      worker:
        condition: service_started

  worker:
    build: .
    container_name: tracker-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIGNAL_RPC_HOST: signal-cli
      SIGNAL_RPC_PORT: 6001
      DATABASE_PATH: /app/data/expenses.db
    volumes:
      - ./data:/app/data
