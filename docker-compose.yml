services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: tracker-signal
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: /bin/sh
    command: -c "chown 1000:1000 -R /home/.local/share/signal-cli && exec setpriv --reuid=1000 --regid=1000 --init-groups --inh-caps=-all signal-cli -c /home/.local/share/signal-cli -u $${SIGNAL_PHONE_NUMBER} daemon --tcp 0.0.0.0:6001 --receive-mode on-connection"
    volumes:
      - ./signal-cli-config:/home/.local/share/signal-cli
    depends_on:
      worker:
        condition: service_started

  worker:
    build: .
    container_name: tracker-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIGNAL_RPC_HOST: signal-cli-rest-api
      SIGNAL_RPC_PORT: 6001
      DATABASE_PATH: /app/data/expenses.db
    volumes:
      - ./data:/app/data
