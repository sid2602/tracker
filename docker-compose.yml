services:
  signal-cli:
    image: ${SIGNAL_CLI_IMAGE:-registry.gitlab.com/packaging/signal-cli/signal-cli-native:latest}
    container_name: tracker-signal
    entrypoint: ["signal-cli"]
    restart: unless-stopped
    env_file:
      - .env
    command: --config /var/lib/signal-cli -u ${SIGNAL_PHONE_NUMBER} daemon --tcp 0.0.0.0:6001 --receive-mode on-connection
    volumes:
      - ./signal-cli-config:/var/lib/signal-cli
    depends_on:
      worker:
        condition: service_started

  worker:
    build: .
    container_name: tracker-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIGNAL_RPC_HOST: signal-cli
      SIGNAL_RPC_PORT: 6001
      DATABASE_PATH: /app/data/expenses.db
    volumes:
      - ./data:/app/data
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.sqlite-backup.schedule=0 3 * * 0"
      - "ofelia.job-exec.sqlite-backup.command=sh -c 'sqlite3 /app/data/expenses.db \".backup /app/data/backup_expenses_$$(date +%F).db\"'"

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: tracker-ofelia
    restart: unless-stopped
    depends_on:
      - worker
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
  rclone:
    image: rclone/rclone:latest
    container_name: tracker-rclone
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"] 
    volumes:
      - ./data:/data:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.cloud-sync.schedule=0 4 * * 0"
      - "ofelia.job-exec.cloud-sync.command=rclone copy /data ${BACKUP_REMOTE_NAME:-gdrive}:/TrackerBackups"
